<div class="rounded-lg border border-copper/15 bg-rust-950 p-4 shadow-inner">
  <div class="flex items-center gap-3 font-mono text-xs">
    <span class="rounded border px-2 py-0.5 font-semibold {% if ok %}border-sage/20 bg-sage/10 text-sage{% else %}border-blood/20 bg-blood/10 text-blood{% endif %}">{{ status }}</span>
    <span class="text-clay">{{ took_ms }} ms</span>
    <span class="truncate text-copper/70">{{ content_type }}</span>
  </div>
  <pre class="mt-3 max-h-56 overflow-auto whitespace-pre-wrap break-all font-mono text-[13px] leading-relaxed text-cream">{{ body }}</pre>
</div>
