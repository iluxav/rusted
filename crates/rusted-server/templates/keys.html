<div class="page-wrap mx-auto max-w-4xl px-10 py-10">
  <div class="mb-8 flex flex-col items-start justify-between gap-5 sm:flex-row sm:items-end">
    <div>
      <p class="eyebrow mb-2">Access / credentials</p>
      <h1 class="page-title">API keys</h1>
      <p class="mt-2 text-sm text-clay">Authenticate calls with a bearer token.</p>
    </div>
    <button hx-post="/console/keys" hx-target="#key-list" hx-swap="afterbegin"
            class="btn-primary px-4 py-2.5 text-sm">
      <span class="font-mono">+</span> Generate key
    </button>
  </div>

  <div class="mb-4 rounded-lg border border-copper/10 bg-copper/[0.035] px-4 py-3 font-mono text-[11px] text-clay">
    <span class="mr-2 text-copper">AUTH</span> Authorization: Bearer &lt;key&gt;
  </div>

  <div id="key-list" class="space-y-2.5">
    {% for key in keys %}
    <div class="surface surface-interactive flex items-center justify-between gap-4 rounded-xl px-5 py-4">
      <div class="flex min-w-0 items-center gap-3.5">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-copper/15 bg-rust-950 font-mono text-sm text-copper">⌁</span>
        <div class="min-w-0">
          <p class="text-sm font-medium text-cream">{{ key.name }}</p>
          <p class="mt-1 truncate font-mono text-[10px] text-clay">{{ key.masked }} <span class="text-copper/40">/</span> created {{ key.created }} <span class="text-copper/40">/</span> {{ key.last_used }}</p>
        </div>
      </div>
      <button hx-delete="/console/keys/{{ key.id }}" hx-target="closest div.flex" hx-swap="outerHTML"
              hx-confirm="Revoke {{ key.name }}? Calls using it will start failing immediately."
              class="shrink-0 rounded-md px-2 py-1.5 font-mono text-[10px] uppercase tracking-wider text-clay transition-colors hover:bg-blood/10 hover:text-blood">revoke</button>
    </div>
    {% endfor %}
  </div>

  <p class="mt-7 font-mono text-[10px] text-clay/60">local mode / keys reset on restart</p>
</div>
