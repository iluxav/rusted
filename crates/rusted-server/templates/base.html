<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}rusted{% endblock %}</title>
  <link rel="icon" type="image/png" href="/assets/rusted-logo2.png">
  <link rel="apple-touch-icon" href="/assets/rusted-logo2.png">
  <meta name="description" content="{% block description %}Rusted deploys sandboxed JavaScript functions to live HTTPS endpoints in under a second and runs them in milliseconds — with MCP tools for AI agents, encrypted secrets, durable state, and environments.{% endblock %}">
  <link rel="preload" href="/assets/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/assets/htmx.min.js" defer></script>
  {#- The whole compiled Tailwind sheet, inlined: the page renders with zero
      render-blocking requests and there is no stylesheet to cache-bust.
      Regenerate with `make css` after editing templates. -#}
  <style>{% include "app.css" %}</style>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-rust-950 text-cream font-sans antialiased">
{% block body %}{% endblock %}
</body>
</html>
