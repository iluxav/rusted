<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}rusted{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rust: { 950: '#0B0908', 900: '#14100D', 800: '#1E1712', 700: '#2B2018' },
            ember: { DEFAULT: '#FF6B24', soft: '#FF9A62', dim: '#B94716' },
            cream: '#F2EAE3',
            clay: '#A99282',
            copper: '#C47B45',
            sage: '#79C69A',
            blood: '#F2776F',
          },
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'],
            sans: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --void: #0b0908;
      --ink: #100d0b;
      --panel: #15110e;
      --panel-raised: #1b1511;
      --panel-hover: #211912;
      --line: #33261d;
      --line-soft: rgba(196, 123, 69, 0.13);
      --ember: #ff6b24;
      --ember-soft: #ff9a62;
      --copper: #c47b45;
      --cream: #f2eae3;
      --muted: #a99282;
    }
    * { box-sizing: border-box; }
    html { background: var(--void); }
    body {
      background:
        radial-gradient(circle at 78% -12%, rgba(255, 107, 36, 0.12), transparent 34rem),
        radial-gradient(circle at -10% 90%, rgba(129, 73, 39, 0.10), transparent 30rem),
        var(--void);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.16;
      background-image: linear-gradient(rgba(196, 123, 69, 0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(196, 123, 69, 0.10) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }
    a, button, input, select, textarea, summary { -webkit-tap-highlight-color: transparent; }
    button, a, summary { outline: none; }
    :is(a, button, input, select, textarea, summary):focus-visible {
      outline: 2px solid var(--ember);
      outline-offset: 3px;
    }
    ::selection { background: var(--ember); color: var(--void); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: #3b2b20; border: 2px solid var(--void); border-radius: 10px; }
    ::-webkit-scrollbar-track { background: var(--void); }
    dialog::backdrop { background: rgba(7, 5, 4, 0.82); backdrop-filter: blur(6px); }
    dialog { animation: dialog-in 160ms ease-out; }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(.985); } }
    @keyframes caret { 0%, 45% { opacity: 1 } 55%, 100% { opacity: 0 } }
    .caret::after { content: ''; display: inline-block; width: 0.55em; height: 1.1em;
      background: var(--ember); margin-left: 2px; vertical-align: text-bottom; animation: caret 1.1s infinite; }
    .surface {
      border: 1px solid var(--line-soft);
      background: linear-gradient(145deg, rgba(27, 21, 17, 0.98), rgba(18, 14, 12, 0.98));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025), 0 22px 60px rgba(0,0,0,.18);
    }
    .surface-interactive { transition: border-color 160ms ease, background 160ms ease, transform 160ms ease; }
    .surface-interactive:hover { border-color: rgba(196, 123, 69, .3); background: var(--panel-hover); }
    .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--copper); }
    .page-title { font-family: "Bricolage Grotesque", sans-serif; font-size: clamp(1.7rem, 3vw, 2.25rem); font-weight: 600; letter-spacing: -.035em; line-height: 1.05; }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      border-radius: .65rem; background: var(--ember); color: #150b06;
      font-weight: 700; box-shadow: 0 8px 24px rgba(255,107,36,.17), inset 0 1px 0 rgba(255,255,255,.3);
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }
    .btn-primary:hover { background: var(--ember-soft); transform: translateY(-1px); box-shadow: 0 10px 30px rgba(255,107,36,.24); }
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      border: 1px solid var(--line); border-radius: .65rem; background: rgba(20,16,13,.8); color: var(--cream);
      transition: border-color 160ms ease, background 160ms ease;
    }
    .btn-secondary:hover { border-color: rgba(255,107,36,.48); background: var(--panel-hover); }
    .field {
      border: 1px solid var(--line); border-radius: .6rem; background: #0e0b09; color: var(--cream);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .field:focus { border-color: var(--ember); box-shadow: 0 0 0 3px rgba(255,107,36,.1); outline: none; }
    .field::placeholder { color: #6d594c; }
    .status-dot { box-shadow: 0 0 0 4px rgba(121,198,154,.08), 0 0 14px rgba(121,198,154,.35); }
    .htmx-indicator { opacity: 0; transition: opacity 160ms ease; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    @media (max-width: 720px) {
      body::before { background-size: 32px 32px; }
      .console-shell { flex-direction: column; min-height: 100%; height: auto; }
      .console-sidebar { width: 100% !important; position: sticky; top: 0; z-index: 30; border-right: 0 !important; border-bottom: 1px solid var(--line-soft); }
      .console-brand { padding: .9rem 1.1rem .5rem !important; }
      .console-nav { display: flex; gap: .4rem; overflow-x: auto; padding: .45rem .75rem .8rem !important; }
      .console-nav > a { flex: 0 0 auto; }
      .console-nav details { display: contents; }
      .console-nav details summary, .console-user { display: none !important; }
      .console-nav details a { display: block; flex: 0 0 auto; padding: .5rem .75rem; }
      .console-content { overflow: visible !important; }
      .page-wrap { padding: 1.5rem 1rem 3rem !important; }
      .responsive-table { display: block; overflow-x: auto; }
      #editor { min-height: 32rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-rust-950 text-cream font-sans antialiased">
{% block body %}{% endblock %}
</body>
</html>
