# Production stack: Postgres, rusted, and Caddy terminating TLS.
#
# Caddy is the only thing exposed. rusted stays on the internal network and
# keeps its default loopback-ish posture behind the proxy — a server that runs
# untrusted code should never be the thing facing the internet directly.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rusted
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rusted
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Host loopback only — never 0.0.0.0. Reach it through an SSH tunnel;
      # Postgres on the open internet is brute-forced within hours.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusted -d rusted"]
      interval: 5s
      timeout: 3s
      retries: 20

  rusted:
    build:
      context: .
      args:
        # Which release to run. Pin it: an unattended :latest is how a
        # deployment changes without anyone deciding it should.
        VERSION: ${RUSTED_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rusted:${POSTGRES_PASSWORD}@db:5432/rusted
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://rusted.sh}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${PUBLIC_URL}/auth/github/callback
      # Reachable from Caddy on the compose network, not from the host.
      RUSTED_HOST: 0.0.0.0
    command: ["serve", "--port", "7411", "--admin-port", "7412"]
    expose:
      - "7411"
      - "7412"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [rusted]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. rusted.sh}

volumes:
  pgdata:
  caddydata:
  caddyconfig:
