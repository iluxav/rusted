[workspace]
resolver = "2"
members = [
    "crates/rusted-engine",
    "crates/rusted-server",
    "crates/rusted-cli",
]

[workspace.dependencies]
rquickjs = { version = "0.12.2", features = ["futures", "parallel"] }
cpu-time = "1.0"
askama = "0.16"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time", "json"] }
rand = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
ureq = { version = "3", features = ["json"] }
sourcemap = "9"
# Rolldown's Rust crates explicitly do not follow semver — pin exactly.
rolldown = "=1.2.1"
rolldown_common = "=1.2.1"
aes-gcm = "0.10"
getrandom = "0.3"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "experimental_metrics_custom_reader"] }
# SigV4 presigning without an HTTP client of its own — the host performs
# head/delete/list itself and hands the signed PUT/GET URLs to callers.
rusty-s3 = "0.8"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.26", default-features = false }
rusted-engine = { path = "crates/rusted-engine" }
rusted-server = { path = "crates/rusted-server" }
axum = "0.8"
tower-http = { version = "0.6", default-features = false, features = ["compression-br", "compression-gzip"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
url = "2"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "functions"] }
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
dirs = "6"
assert_cmd = "2"
tempfile = "3"

[profile.release]
debug = true

# Release artifacts: no debug info, one codegen unit, LTO. Thin rather than
# fat: within a few percent of the same size, but the final optimization
# stage runs in parallel instead of single-threaded — it halved the release
# build (fat LTO measured ~7min, thin ~4min on the v0.25.0 tree).
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
