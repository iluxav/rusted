name: Release

on:
  push:
    tags: ["v*"]
  # Handy for rehearsing the build without cutting a release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners throughout: the build compiles C (QuickJS, blake3),
          # which cross-compilation makes needlessly fragile. Apple Silicon
          # only — GitHub retired its Intel macOS runners.
          - target: aarch64-apple-darwin
            runner: macos-14
          # 22.04 rather than latest: binaries link against its older glibc and
          # so keep running on older distros.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --profile dist --target ${{ matrix.target }} -p rusted-cli

      - name: Package
        run: |
          set -euo pipefail
          staging="rusted-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/dist/rusted" "$staging/"
          cp README.md LICENSE.md LICENSE-APACHE LICENSE-AGPL "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          # BSD and GNU ship different checksum tools; both are fine.
          if command -v sha256sum >/dev/null; then
            sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
          else
            shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
          fi
          ls -lh "$staging.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: rusted-${{ matrix.target }}
          path: |
            rusted-${{ matrix.target }}.tar.gz
            rusted-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 | sed 's| .*/| |' > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "rusted $version" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo '')" \
            artifacts/* || \
          gh release create "$GITHUB_REF_NAME" \
            --title "rusted $version" \
            --generate-notes \
            artifacts/*
